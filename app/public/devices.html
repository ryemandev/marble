<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Device Preview</title>
<style>
  body { margin: 0; background: #111; color: #aaa; font: 12px system-ui; padding: 20px; display: flex; gap: 24px; align-items: flex-start; }
  figure { margin: 0; display: flex; flex-direction: column; gap: 8px; }
  iframe { border: 1px solid #333; border-radius: 28px; background: #000; }
  select { background: #222; color: #ddd; border: 1px solid #333; padding: 4px 8px; border-radius: 6px; }
</style>
</head>
<body>
  <figure><span>Tab <select id="tab"></select></span></figure>
  <figure><span>Phone · 390 × 844</span><iframe id="phone" width="390" height="844"></iframe></figure>
  <figure><span>Tablet · 820 × 1180</span><iframe id="tablet" width="820" height="1180"></iframe></figure>
  <script>
    const tabs = ["dashboard", "journal", "showcase", "strategy", "study", "analytics", "propfirm", "ai", "points", "community"];
    const sel = document.getElementById("tab");
    sel.innerHTML = tabs.map((t) => `<option>${t}</option>`).join("");
    sel.value = new URLSearchParams(location.search).get("tab") || "dashboard";
    const load = () => ["phone", "tablet"].forEach((id) => (document.getElementById(id).src = `/#${sel.value}`));
    sel.onchange = load;
    load();
  </script>
</body>
</html>
